plugins { id 'com.android.application' }
android { namespace 'mx.elcosteno.caja'; compileSdk 35
 defaultConfig { applicationId 'mx.elcosteno.caja'; minSdk 26; targetSdk 32; versionCode 1; versionName '1.0' } }

// Generate Android launcher and splash drawable from the original repository logo.
tasks.register('prepareBrandLogo', Copy) {
    from rootProject.file('icon-512.png')
    into file('src/main/res/drawable-nodpi')
    rename { 'brand_logo.png' }
    doFirst { if (!rootProject.file('icon-512.png').exists()) throw new GradleException('Missing icon-512.png') }
}
tasks.named('preBuild').configure { dependsOn tasks.named('prepareBrandLogo') }
