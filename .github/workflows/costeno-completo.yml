name: El Costeno Caja APK completa
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app/**'
      - '.github/workflows/costeno-completo.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar interfaz web
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          cp manifest.webmanifest app/src/main/assets/manifest.webmanifest
          cp icon-*.png app/src/main/assets/
      - name: Compilar APK Android completa
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ElCostenoCaja-APK-completa
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
