name: El Costeno Caja APK completa
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar interfaz web
        run: |
          mkdir -p app/src/main/assets
          python3 -m pip install --quiet pillow
          python3 scripts/generate_animation_assets.py
          python3 scripts/fix_animation_audio.py
          cp index.html app/src/main/assets/index.html
          cp manifest.webmanifest app/src/main/assets/manifest.webmanifest
          cp icon-*.png app/src/main/assets/
          find . -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.webp' -o -iname '*.svg' -o -iname '*.js' -o -iname '*.css' \) -exec cp -t app/src/main/assets/ {} +
          for asset in file_00000000277c82128c9cdeb4bae0c5ea.png file_00000000a8b88212877a593c1893ae10.png; do
            if [ ! -f "$asset" ]; then echo "ERROR: Falta recurso original $asset. No publicar APK incompleta."; exit 1; fi
            cp "$asset" app/src/main/assets/
          done
          grep -q 'cardTypeDialog' app/src/main/assets/index.html
          test -s app/src/main/assets/costeno-dictado.js
          python3 -c 'from pathlib import Path; p=Path("app/src/main/assets/index.html"); js=Path("app/src/main/assets/costeno-dictado.js").read_text(); html=p.read_text(); marker="/* COSTENO_DICTADO_INLINE */"; assert html.count(marker)==1, "Falta punto de integración del intérprete"; p.write_text(html.replace(marker,js))'
          grep -q 'costenoDictadoVersion' app/src/main/assets/index.html
          python3 -c 'from pathlib import Path; import re; h=Path("app/src/main/assets/index.html").read_text(); scripts=re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>",h); assert len(scripts)>=1; Path("/tmp/costeno-main.js").write_text(scripts[0]); assert "const previous=applySpokenOrder" in scripts[0]; assert scripts[0].index("let orderPlates=")<scripts[0].index("const previous=applySpokenOrder")<scripts[0].rindex("})();"), "Intérprete fuera del ámbito de pedidos"'
          node --check /tmp/costeno-main.js
          # Validar también los módulos de personalización e iconos, no solo el script principal.
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          html=Path('app/src/main/assets/index.html').read_text()
          scripts=re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>',html)
          assert len(scripts)>=3, 'Faltan scripts de la aplicación'
          for n,code in enumerate(scripts):
              p=Path(f'/tmp/costeno-script-{n}.js')
              p.write_text(code)
              subprocess.run(['node','--check',str(p)],check=True)
          assert 'ec_icon_packs' in html and 'ec_active_pack' in html, 'Falta gestor de paquetes'
          assert 'costenoActivePack' in html and 'globalIcons()' in html, 'Falta cambio global de iconos'
          assert 'costenoTabletNav' in html, 'Falta navegación principal'
          print(f'Validados {len(scripts)} scripts y funciones principales')
          PY
      - name: Compilar APK Android completa
        run: gradle assembleDebug --no-daemon
      - name: Verificar APK completa y tamaño antes de publicar
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BYTES=$(stat -c%s "$APK")
          echo "Tamaño APK: $BYTES bytes ($(du -h "$APK" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'assets/costeno-dictado.js'
          unzip -l "$APK" | grep -q 'classes.dex'
          if [ "$BYTES" -lt 8000000 ]; then
            echo "ERROR: APK inferior a 8 MB. No publicar versión reducida."
            exit 1
          fi
      - name: Publicar APK descargable en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" ElCostenoCaja.apk
          TAG="costeno-apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" ElCostenoCaja.apk --title "El Costeño Caja APK $TAG" --notes "APK de prueba compilada automáticamente desde el commit ${GITHUB_SHA}. Instalar bajo responsabilidad del usuario; verificar animación y datos."
          echo "Descarga: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ElCostenoCaja-APK-completa-${{ github.run_id }}
          retention-days: 30
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
