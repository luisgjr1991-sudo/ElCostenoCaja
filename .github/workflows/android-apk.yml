name: APK PRINCIPAL El Costeño (android)
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - 'scripts/download_cash_sounds.py'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Preparar SDK Android del runner
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar contenido de la caja
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          grep -q 'cardTypeDialog' android/app/src/main/assets/index.html || { echo 'Falta selector de tarjeta'; exit 1; }
          cp android/app/src/main/file_000000002e348212a1fdaa37bd6a866d.png android/app/src/main/assets/file_000000002e348212a1fdaa37bd6a866d.png
          cp file_00000000277c82128c9cdeb4bae0c5ea.png android/app/src/main/assets/file_00000000277c82128c9cdeb4bae0c5ea.png
          cp file_00000000a8b88212877a593c1893ae10.png android/app/src/main/assets/file_00000000a8b88212877a593c1893ae10.png
          cp icon-512.png android/app/src/main/assets/icon-512.png || true
      - name: Integrar grabaciones reales CC0 de caja registradora
        run: |
          python3 scripts/download_cash_sounds.py
          test -s android/app/src/main/assets/sounds/register_classic.mp3
          test -s android/app/src/main/assets/sounds/register_modern.mp3
          test -s android/app/src/main/assets/sounds/register_key.mp3
          test -s android/app/src/main/assets/sounds/soft_click.mp3
          test -s android/app/src/main/assets/sounds/warning.mp3
      - name: Usar logo original como icono Android
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Image.open('file_00000000a8b88212877a593c1893ae10.png').convert('RGBA')
          # Conserva el diseño y lo centra en un lienzo cuadrado.
          src.thumbnail((460,460), Image.Resampling.LANCZOS)
          out=Image.new('RGBA',(512,512),(0,0,0,0))
          out.alpha_composite(src,((512-src.width)//2,(512-src.height)//2))
          folder=Path('android/app/src/main/res/drawable-nodpi')
          folder.mkdir(parents=True,exist_ok=True)
          out.save(folder/'brand_logo.png')
          # Recurso exclusivo del icono, sin colisiones con iconos heredados.
          out.save(folder/'costeno_launcher.png')
          # Icono independiente de la pantalla de inicio y del ticket.
          for density,size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              target=Path('android/app/src/main/res/mipmap-'+density)
              target.mkdir(parents=True,exist_ok=True)
              out.resize((size,size),Image.Resampling.LANCZOS).save(target/'ic_launcher.png')
          PY
      - name: Generar sombrero y letras como PNG independientes para la animación
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageDraw,ImageFilter
          from pathlib import Path
          src=Image.open('file_00000000a8b88212877a593c1893ae10.png').convert('RGBA')
          w,h=src.size
          # Silueta del sombrero trazada sobre el diseño original (1536x1024).
          pts=[[475,255],[487,212],[518,181],[569,160],[635,148],[719,148],[816,161],[906,186],[976,96],[1031,37],[1090,12],[1145,10],[1201,42],[1240,95],[1275,178],[1294,266],[1367,299],[1440,341],[1491,402],[1510,465],[1490,524],[1450,565],[1393,590],[1331,593],[1260,572],[1190,544],[1114,508],[1045,468],[975,429],[902,404],[834,393],[790,412],[736,416],[675,406],[610,401],[552,381],[514,350],[490,317]]
          pts=[(round(x*w/1536),round(y*h/1024)) for x,y in pts]
          mask=Image.new('L',(w,h),0)
          ImageDraw.Draw(mask).polygon(pts,fill=255)
          mask=mask.filter(ImageFilter.GaussianBlur(max(1,w/900)))
          alpha=src.getchannel('A')
          from PIL import ImageChops
          hat=src.copy();hat.putalpha(ImageChops.multiply(alpha,mask))
          body=src.copy();body.putalpha(ImageChops.multiply(alpha,ImageChops.invert(mask)))
          out=Path('android/app/src/main/assets')
          hat.save(out/'logo_hat_animation.png')
          body.save(out/'logo_body_animation.png')
          assert (out/'logo_hat_animation.png').stat().st_size>5000
          assert (out/'logo_body_animation.png').stat().st_size>5000
          PY
      - name: Compilar APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Verificar APK principal completa
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          bytes=$(stat -c%s android/app/build/outputs/apk/debug/app-debug.apk)
          echo "APK size: $bytes bytes"
          test "$bytes" -ge 5000000 || { echo 'ERROR: APK sospechosamente pequeña; no publicar'; exit 1; }
      - name: Nombrar APK para compartir
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/ElCostenoCaja.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ElCostenoCaja-PRINCIPAL-APK
          path: android/app/build/outputs/apk/debug/ElCostenoCaja.apk
