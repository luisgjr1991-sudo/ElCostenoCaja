name: APK PRINCIPAL El Costeño (android)
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Preparar SDK Android del runner
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar contenido de la caja
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cp android/app/src/main/file_000000002e348212a1fdaa37bd6a866d.png android/app/src/main/assets/file_000000002e348212a1fdaa37bd6a866d.png
          cp file_00000000277c82128c9cdeb4bae0c5ea.png android/app/src/main/assets/file_00000000277c82128c9cdeb4bae0c5ea.png
          cp file_00000000a8b88212877a593c1893ae10.png android/app/src/main/assets/file_00000000a8b88212877a593c1893ae10.png
          cp icon-512.png android/app/src/main/assets/icon-512.png || true
      - name: Usar logo original como icono Android
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Image.open('file_00000000a8b88212877a593c1893ae10.png').convert('RGBA')
          # Conserva el diseño y lo centra en un lienzo cuadrado.
          src.thumbnail((460,460), Image.Resampling.LANCZOS)
          out=Image.new('RGBA',(512,512),(0,0,0,0))
          out.alpha_composite(src,((512-src.width)//2,(512-src.height)//2))
          folder=Path('android/app/src/main/res/drawable-nodpi')
          folder.mkdir(parents=True,exist_ok=True)
          out.save(folder/'brand_logo.png')
          # Recurso exclusivo del icono, sin colisiones con iconos heredados.
          out.save(folder/'costeno_launcher.png')
          # Icono independiente de la pantalla de inicio y del ticket.
          for density,size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              target=Path('android/app/src/main/res/mipmap-'+density)
              target.mkdir(parents=True,exist_ok=True)
              out.resize((size,size),Image.Resampling.LANCZOS).save(target/'ic_launcher.png')
          PY
      - name: Compilar APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Verificar APK principal completa
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          bytes=$(stat -c%s android/app/build/outputs/apk/debug/app-debug.apk)
          echo "APK size: $bytes bytes"
          test "$bytes" -ge 1000000 || { echo 'ERROR: APK sospechosamente pequeña; no publicar'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: ElCostenoCaja-PRINCIPAL-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
