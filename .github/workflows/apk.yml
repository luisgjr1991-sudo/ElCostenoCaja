name: LEGACY - APK pequeña (no usar)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar Android SDK preinstalado
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms" || exit 1
          test -d "$ANDROID_HOME/build-tools" || exit 1
      - name: Preparar archivos web
        run: |
          mkdir -p app/src/main/assets app/src/main/res/drawable-nodpi
          cp index.html manifest.webmanifest app/src/main/assets/
          cp icon-*.png app/src/main/assets/
          cp icon-512.png app/src/main/res/drawable-nodpi/brand_logo.png
      - name: Compilar APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ElCostenoCaja-APK
          path: app/build/outputs/apk/debug/app-debug.apk
